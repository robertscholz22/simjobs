[project]
name = "simjobs"
version = "0.1.0"
description = "Simulation job service: reactor solver behind an HTTP API and a task queue"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "fastapi>=0.118",
    "numpy>=2.3",
    "pydantic>=2.11",
    "scipy>=1.16",
    "typer>=0.19",
    "uvicorn>=0.37",
]

[project.scripts]
simjobs = "simjobs.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simjobs"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# typer and fastapi put these calls in default arguments on purpose
extend-immutable-calls = ["typer.Option", "type.Argument", "fastapi.Depends", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
